name: CI - Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests when available
        run: npm run test --if-present

      - name: Run security audit
        env:
          NPM_AUDIT_REPORT: ${{ runner.temp }}/npm-audit-report.json
        run: |
          set -euo pipefail

          audit_status=0
          npm audit --audit-level=high --json > "$NPM_AUDIT_REPORT" || audit_status=$?

          # npm audit returns 1 when it finds vulnerabilities. Other exit codes
          # indicate an operational or command error and must fail the workflow.
          if (( audit_status > 1 )); then
            echo "npm audit falhou com código $audit_status." >&2
            exit "$audit_status"
          fi

          NPM_AUDIT_EXIT_CODE="$audit_status" node scripts/check-audit.mjs

      - name: Build application
        run: npm run build
